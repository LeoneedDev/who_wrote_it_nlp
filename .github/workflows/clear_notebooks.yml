name: Clear notebooks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.ipynb"
  pull_request:
    paths:
      - "**/*.ipynb"
    

permissions:
  contents: write

jobs:
  clear-notebooks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install nbstripout
        run: pip install nbstripout

      - name: Clear notebook outputs
        run: |
          find . -type f -name "*.ipynb" -print0 | xargs -0 -r nbstripout

      - name: Commit and push changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: clear notebook outputs"
            git push
          else
            echo "No notebook changes."
          fi